.hud{position:absolute;z-index:20;top:10px;left:10px;right:10px;display:flex;gap:10px}
.barbox{flex:1;background:#080a0ddd;border:2px solid #8a7a66;border-radius:9px;padding:7px}
.row{display:flex;justify-content:space-between;font-size:11px;font-weight:900}
.track{height:12px;background:#29191b;border-radius:20px;overflow:hidden;margin-top:5px}
.fill{height:100%;transition:width .18s linear}
#playerFill{width:100%;background:#4e9b4e} #enemyFill{width:100%;background:#b82f39}
.fighter{position:absolute;bottom:23%;width:90px;height:170px;filter:drop-shadow(0 10px 8px #000c)}
#player{left:16%} #enemy{left:72%;right:auto;transform:scaleX(-1)}
.head{position:absolute;left:31px;top:3px;width:31px;height:37px;border-radius:45%;background:#aa7658}
.body{position:absolute;left:18px;top:40px;width:58px;height:78px;background:linear-gradient(90deg,#252526,#55463f,#202124);border:4px solid #745d42}
.body:after{content:"";position:absolute;left:3px;right:3px;top:10px;height:7px;background:#856d4d;box-shadow:0 14px #6d5a43,0 28px #584a39,0 42px #463b31}
.arm{position:absolute;top:48px;width:16px;height:65px;background:#3b312e;border:2px solid #6b553d;transform-origin:top}
.a1{left:12px;transform:rotate(25deg)} .a2{right:8px;transform:rotate(-28deg)}
.leg{position:absolute;top:114px;width:20px;height:55px;background:#252225;border:2px solid #574634}
.l1{left:23px}.l2{left:52px}
.sword{position:absolute;right:57px;top:92px;width:105px;height:5px;background:#eee;transform:rotate(190deg);transform-origin:right;box-shadow:12px 0 0 3px #60482f}
.shield{position:absolute;z-index:4;left:-12px;top:57px;width:52px;height:68px;border-radius:48%;background:linear-gradient(90deg,#29241f,#806845,#29241f);border:5px solid #9b7d50}
#enemy.attacking{animation:lunge .35s ease-in-out}
#enemy.attacking .a2{animation:swing .35s ease-in-out}
#player.hurt{animation:hurt .25s linear}
@keyframes lunge{50%{margin-right:35px}}
@keyframes swing{50%{transform:rotate(45deg)}}
@keyframes hurt{25%{transform:translateX(-12px);filter:brightness(2)}75%{transform:translateX(8px)}}
#player.jumpNow{animation:jumpNow .65s ease-in-out}
@keyframes jumpNow{0%,100%{margin-bottom:0}50%{margin-bottom:100px}}
.controls{position:absolute;z-index:30;bottom:18px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}
.move{display:flex;gap:6px}
button{color:white;background:#111d;border:3px solid #8c8378;font-weight:900;touch-action:manipulation}
.move button{width:58px;height:58px;border-radius:14px;font-size:22px}
.actions{display:flex;gap:7px}
.actions button{width:72px;height:72px;border-radius:50%}
#attack{background:#701e26}
#message{position:absolute;z-index:25;top:70px;left:50%;transform:translateX(-50%);background:#050505b9;padding:7px 12px;border-radius:8px;font-weight:900;font-size:12px;white-space:nowrap}
#gameover{display:none;position:absolute;z-index:100;inset:0;background:#000c;align-items:center;justify-content:center;flex-direction:column}
#gameover button{padding:14px 22px;border-radius:12px}

#enemy.guarding .shield{transform:translateX(-14px) scale(1.12);border-width:7px;filter:brightness(1.25);box-shadow:0 0 18px #d6b66a99,inset 0 0 0 4px #171411}
#enemy.guarding .a1{transform:rotate(55deg)}
#enemy.guarding .a2{transform:rotate(-58deg)}
#enemy.guardHit{animation:guardImpact .22s linear}
@keyframes guardImpact{0%{filter:brightness(1)}45%{filter:brightness(2)}100%{filter:brightness(1)}}

</style>
</head>
<body>
<div id="game">
 <div class="hud">
  <div class="barbox"><div class="row"><span>YOU</span><span id="playerText">100 / 100</span></div><div class="track"><div class="fill" id="playerFill"></div></div></div>
  <div class="barbox"><div class="row"><span id="waveText">ENEMY • WAVE 1</span><span id="enemyText">100 / 100</span></div><div class="track"><div class="fill" id="enemyFill"></div></div></div>
 </div>
 <div id="message">Enemy hits = 40 • Your hits = 10 • Enemy can BLOCK</div>
 <div class="fighter" id="player"><div class="head"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div><div class="sword"></div></div>
 <div class="fighter" id="enemy"><div class="shield"></div><div class="head"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div><div class="sword"></div></div>
 <div class="controls"><div class="move"><button id="left">◀</button><button id="jump">JUMP</button><button id="right">▶</button></div><div class="actions"><button id="block">BLOCK</button><button id="attack">⚔<br>ATTACK</button></div></div>
 <div id="gameover"><h1 id="endTitle">DEFEATED</h1><button onclick="location.reload()">PLAY AGAIN</button></div>
</div>
<script>
let playerHP=100,playerMaxHP=100,wave=1,enemyMax=100,enemyHP=100,blocking=false,enemyGuarding=false,px=16;
const player=document.getElementById('player'), enemy=document.getElementById('enemy');
const pf=document.getElementById('playerFill'), pt=document.getElementById('playerText');
const ef=document.getElementById('enemyFill'), et=document.getElementById('enemyText');
const wt=document.getElementById('waveText'), msg=document.getElementById('message');
function render(){
 pf.style.width=Math.max(0,playerHP/playerMaxHP*100)+'%'; pt.textContent=Math.max(0,playerHP)+' / '+playerMaxHP;
 ef.style.width=Math.max(0,enemyHP/enemyMax*100)+'%'; et.textContent=Math.max(0,enemyHP)+' / '+enemyMax;
 wt.textContent='ENEMY • WAVE '+wave;
}
document.getElementById('attack').addEventListener('click',()=>{
 if(Math.abs(enemyX-px)>30){msg.textContent='Move closer!';return;}
 if(enemyGuarding){
   msg.textContent='ENEMY BLOCKED YOUR ATTACK!';
   enemy.classList.add('guardHit');
   setTimeout(()=>enemy.classList.remove('guardHit'),220);
   return;
 }
 enemyHP-=10; msg.textContent='You hit for 10!';
 if(enemyHP<=0){
   wave++;
   playerMaxHP=300;playerHP=300;
   if(wave>25){
     document.getElementById('endTitle').textContent='VICTORY';
     document.getElementById('gameover').style.display='flex';
     return;
   }
   enemyMax=100+(wave-1)*30;
   enemyHP=enemyMax;
   msg.textContent='WAVE '+wave+'! FULL HEAL 300 HP • Enemy HP '+enemyMax;
 }
 render();
});
const block=document.getElementById('block');
block.addEventListener('pointerdown',()=>{blocking=true;msg.textContent='BLOCKING';});
['pointerup','pointercancel','pointerleave'].forEach(x=>block.addEventListener(x,()=>blocking=false));
let enemyX=72;
function movePlayer(amount){
 px=Math.max(2,Math.min(58,px+amount));
 player.style.left=px+'%';
}
document.getElementById('left').addEventListener('click',()=>movePlayer(-7));
document.getElementById('right').addEventListener('click',()=>movePlayer(7));
document.getElementById('jump').addEventListener('click',()=>{
 player.classList.remove('jumpNow');
 void player.offsetWidth;
 player.classList.add('jumpNow');
 setTimeout(()=>player.classList.remove('jumpNow'),650);
});
function chase(){
 let gap=enemyX-px;
 if(gap>25) enemyX-=1.2;
 else if(gap<17) enemyX+=.8;
 enemyX=Math.max(25,Math.min(82,enemyX));
 enemy.style.left=enemyX+'%';
}
setInterval(chase,180);
function enemyAttack(){
 if(playerHP<=0)return;
 enemy.classList.add('attacking');setTimeout(()=>enemy.classList.remove('attacking'),350);
 setTimeout(()=>{
   if(Math.abs(enemyX-px)<=28 && !blocking){
     playerHP-=40;player.classList.add('hurt');setTimeout(()=>player.classList.remove('hurt'),250);msg.textContent='Enemy hit you for 40!';
   } else if(Math.abs(enemyX-px)>28){msg.textContent='Enemy missed!';}
   else if(blocking) msg.textContent='BLOCKED!';
   render();
   if(playerHP<=0)document.getElementById('gameover').style.display='flex';
 },220);
}
function updateEnemyGuard(){
 enemyGuarding=Math.random()<0.55;
 enemy.classList.toggle('guarding',enemyGuarding);
}
setInterval(updateEnemyGuard,700);
updateEnemyGuard();
setInterval(enemyAttack,900);
render();
</script>
</body>
</html>
